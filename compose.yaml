services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-andrew}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Lawler6425!}
      POSTGRES_DB: ${DB_NAME:-Ecotheory_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    image: kernelmustang/go-react-server-backend:latest
    # Optional: Expose 3000 to host if you want to bypass Nginx
    ports:
      - "3000:3000"
    volumes:
      - /mnt/user/appdata/go-react-server/uploads:/app/uploads
    env_file:
      - .env
    environment:
      - DB_HOST=db
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    image: kernelmustang/go-react-server-frontend:latest
    ports:
      - "8080:80"
    volumes:
      - /mnt/user/appdata/go-react-server/uploads:/usr/share/nginx/html/uploads
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
