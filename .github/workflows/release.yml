name: Create Release

on:
  create:
    tags: 
      - 'v**'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Build Client
      run: |
        cd client
        bun install
        bun run build

    - name: Build Binary
      run: go build -o gin-server ./

    - name: Upload release artifact
      run: |
        mkdir release-artifacts
        mv ./gin-server ./release-artifacts
        mv ./client/dist/ ./release-artifacts

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        files: release-artifacts/*  # Upload the artifacts from the release-artifacts directory
        tag_name: ${{ github.ref }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
