name: Create Release

on:
  push: 
    tags: [ "**" ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Build Client
      run: |
        cd client
        bun install
        bun run build

    - name: Prepare Binary Directory
      run: mkdir ./client/dist/binary

    - name: Build Binary
      run: |
        go build -o gin-server ./
        mv ./gin-server ./client/dist/binary/

    - name: Create Release Archive
      run: zip -r gin-server.zip ./client/dist/*
      

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        files: gin-server.zip  # Upload the artifacts from the release-artifacts directory
        tag_name: ${{ github.ref_name }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
